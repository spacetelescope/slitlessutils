[project]
name = 'slitlessutils'
description = 'A compendium of tools to analyze slitless spectroscopy'
readme = 'README.md'
license = 'BSD-3-Clause'
license-files = ['LICENSE.rst']
authors = [
    {name = 'Slitlessutils Developers'},
]
keywords = [
    'grism',
    'prism',
    'slitless spectroscopy',
    'HST',
    'WFC3',
    'UVIS',
    'IR',
    'ACS',
    'WFC',
    'SBC',
    'JWST',
    'NIRISS',
    'wide field'
]
classifiers = [
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy',
]
dynamic = ['version']
requires-python = '>=3.12'
dependencies = [
    'astropy>=6.1',
    'astroquery>=0.4.7',
    'h5py>=3.11',
    'drizzlepac>=3.11',
    'networkx>=3.3',
    'numba>=0.62.0',
    'numpy>=2.0.1',
    'matplotlib>=3.9',
    'packaging>=24.2',
    'pandas>=2.2.2',
    'psutil>=5.9.6',
    'pypolyclip>=1.1.0',
    'pysiaf>=0.24.0',
    'pyyaml>=6.0.1',
    'scikit-image>=0.23.1',
    'scipy>=1.13',
    'shapely>=2.0.4',
    'tqdm>=4.67'
]

[project.urls]
Homepage = 'https://github.com/spacetelescope/slitlessutils'
Documentation = 'https://slitlessutils.readthedocs.io/en/stable/'

[project.scripts]
listwcs = "slitlessutils.core.preprocess.astrometry.list_wcs:main"

[project.optional-dependencies]
test = [
    'pytest>=9.0',
    'pytest-astropy-header>=0.2.2',
    'pytest-cov>=7.0',
    'pytest-doctestplus>=1.4',
    'pytest-remotedata>=0.4.1',
]
docs = [
    'numpydoc>=1.8',
    'pydata-sphinx-theme>=0.16',
    'sphinx>=8.2',  # keep in sync with docs/conf.py
    'sphinx-astropy>=1.11',
    'sphinx-automodapi>=0.18',
    'sphinx-copybutton>=0.5',
]
dev = [
    'slitlessutils[docs,test]',
    'pre-commit>=4.0',
    'tox>=4.24',
]

[build-system]
requires = [
    'setuptools>=77.0.1',
    'setuptools_scm>=8.2',
]
build-backend = 'setuptools.build_meta'

[tool.setuptools_scm]
version_file = 'slitlessutils/version.py'

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.pytest]
minversion = "9.0"
testpaths = [
    'slitlessutils',
    'docs',
]
norecursedirs = [
    'docs/_build',
]
astropy_header = true
# Packages whose versions are shown in the pytest header. Keep this
# list in sync with the dependencies above.
astropy_header_packages = [
    'slitlessutils',
    'astropy',
    'astroquery',
    'drizzlepac',
    'h5py',
    'matplotlib',
    'networkx',
    'numba',
    'numpy',
    'packaging',
    'pandas',
    'psutil',
    'pypolyclip',
    'pysiaf',
    'scipy',
    'shapely',
    'skimage',
    'tqdm',
    'yaml',
]
doctest_plus = 'enabled'
text_file_format = 'rst'
addopts = [
    '-ra',
    '--color=yes',
    '--doctest-rst',
    '--strict-config',
    '--strict-markers',
]
log_level = 'INFO'
xfail_strict = true
remote_data_strict = false
filterwarnings = [
    'error',  # turn warnings into exceptions
    'ignore:unclosed file:ResourceWarning',
    "ignore:'leaveWhitespace' deprecated:DeprecationWarning",
    # Ignore warning from astropy.io
    'ignore: Card is too long, comment will be truncated.',
    # Ignore cast warning in drizzle
    'ignore: invalid value encountered in cast:RuntimeWarning'
]

[tool.coverage.run]
omit = [
    'slitlessutils/__init__*',
    'slitlessutils/**/conftest.py',
    'slitlessutils/**/tests/*',
    'slitlessutils/version*',
    '*/slitlessutils/__init__*',
    '*/slitlessutils/**/conftest.py',
    '*/slitlessutils/**/tests/*',
    '*/slitlessutils/version*',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'def main\\(.*\\):',
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Preview enables the fixable pycodestyle whitespace and blank-line rules
preview = true
select = [
    'E',  # pycodestyle errors
    'F',  # pyflakes
    'W',  # pycodestyle warnings
    'UP',  # pyupgrade
    'RUF100',  # unused noqa directives
]
ignore = [
    'E501',  # line too long
    'E741',  # ambiguous variable name
]

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.repo-review]
ignore = [
    'MY',  # ignore MyPy
    'PC110',  # ignore using black or ruff-format in pre-commit
    'PC111',  # ignore using blacken-docs in pre-commit
    'PC140',  # ignore using mypy in pre-commit
    'PC180',  # ignore using prettier in pre-commit
    'PC901',  # ignore using custom pre-commit update message
    'PC902',  # ignore custom pre-commit CI autofix message
    'PP006',  # ignore missing dependency-groups in pyproject.toml
    'PY005',  # ignore having a tests/ folder
    'RF101',  # ignore not selecting the Ruff flake8-bugbear rules
]

[tool.codespell]
skip = '*.pdf'
ignore-words-list = """
    exten,
    ot,
    Pidgeon,
    som,
"""
